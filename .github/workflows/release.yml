name: Create release

on:
    push:
        tags: ["v*"]
    # version-tag.yml dispatches this for the tags it creates: a tag pushed
    # with GITHUB_TOKEN starts no push workflow.
    workflow_dispatch:

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        uses: tree-sitter/workflows/.github/workflows/release.yml@main
        with:
            attestations: true
