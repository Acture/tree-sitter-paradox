name: Publish package

on:
    push:
        tags: ["v*"]

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    npm:
        uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
        secrets:
            NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
    crates:
        name: Publish crate
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Verify tag matches crate version
                run: |-
                    crate_version="$(python3 - <<'PY'
                    import tomllib
                    from pathlib import Path

                    cargo_toml = Path("Cargo.toml").read_bytes()
                    print(tomllib.loads(cargo_toml.decode("utf-8"))["package"]["version"])
                    PY
                    )"
                    tag_version="${GITHUB_REF_NAME#v}"

                    if [ "$crate_version" != "$tag_version" ]; then
                      printf 'Cargo.toml version %s does not match tag %s\n' "$crate_version" "$GITHUB_REF_NAME" >&2
                      exit 1
                    fi
            -   name: Authenticate with crates.io via trusted publishing
                uses: rust-lang/crates-io-auth-action@v1
                id: auth
            -   name: Publish crate
                run: cargo publish
                env:
                    CARGO_REGISTRY_TOKEN: ${{steps.auth.outputs.token}}
    pypi:
        uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
        secrets:
            PYPI_API_TOKEN: ${{secrets.PYPI_TOKEN}}
